name: Docker Hub build
on:
  push:
    branches:
      - develop
      - fix_ci_builds
      - master
      - "release/*"
    tags:
      - "carma-system-*"

jobs:
  dockerhub:
    uses: usdot-fhwa-stol/actions/.github/workflows/dockerhub.yml@main
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}